function dt(s){const c=CFG[s],R=rows(s),k=c.i.length;
const opt=(a,sel)=>a.map(([v,t])=>`<option value="${v}"${String(sel)===String(v)?' selected':''}>${t}</option>`).join('');
let h=`<div class="box"><h2>${c.t}</h2><p class="mut">${c.rule} · แยกรายไตรมาส ปีงบประมาณ 2569 และผลรวมปีงบประมาณ</p><div class="f"><select id="fi">${opt([[-1,'ทุกตัวชี้วัด'],...c.i.map((t,i)=>[i,t])],st[s].i)}</select><select id="fu">${opt([['','ทุกหน่วยบริการ'],...c.d.map(r=>[r[0],r[0]])],st[s].u)}</select><button id="ex">⬇ ส่งออก CSV</button></div></div>`+ch(s)+`<div class="box"><h2>ตารางข้อมูลแยกรายไตรมาส</h2>`;
const P=R.filter(r=>r.ok).length;
h+=`<div class="cards"><div class="c"><small>รายการที่แสดง</small><b>${R.length}</b></div><div class="c g"><small>ผ่าน</small><b>${P}</b></div><div class="c r"><small>ไม่ผ่าน</small><b>${R.length-P}</b></div></div>`;
h+=`<div class="wrap"><table><tr><th>หน่วยบริการ</th><th>ตัวชี้วัด</th><th class="n q1">ไตรมาส 1</th><th class="n q2">ไตรมาส 2</th><th class="n q3">ไตรมาส 3</th><th class="n q4">ไตรมาส 4</th><th class="n q5">รวมปีงบ</th><th>แปลผล</th></tr>`;
R.forEach(r=>h+=`<tr class="${r.u==='รวมจังหวัด'?'tot':''}"><td>${r.u==='รวมจังหวัด'?r.u:c.pre+r.u}</td><td>${r.ii+1}</td>${r.v.map((x,j)=>`<td class="n">${j==4?'<b>'+x.toFixed(2)+'</b>':x.toFixed(2)}</td>`).join('')}<td>${pill(r.ok)}</td></tr>`);
return h+`</table></div></div>`}
function ch(s){const c=CFG[s],T=s==2?5:70,u=st[s].u||'รวมจังหวัด',row=c.d.find(r=>r[0]===u),QC=['#0a6cff','#00a884','#ff8a1a','#ec4899','#7a3cff'],ids=st[s].i>=0?[st[s].i]:c.i.map((_,i)=>i),o=[...c.d.filter(r=>r[0]!=='รวมจังหวัด'),c.d.find(r=>r[0]==='รวมจังหวัด')];
return ids.map(i=>{const v=row.slice(1+i*5,6+i*5),m=Math.max(...v,T)*1.15,g=x=>x/m*100,
A=`<div class="va">${v.map((x,j)=>`<div class="vb"><span>${x.toFixed(2)}</span><i style="height:${g(x)}%;background:${QC[j]}"></i><em>${j<4?'ไตรมาส '+(j+1):'รวมปีงบ'}</em></div>`).join('')}<div class="tg" style="bottom:${g(T)}%"><small>เป้า ${s==2?'≤':'>'}${T}</small></div></div>`,
M=Math.max(...o.map(r=>r[5+i*5]),T)*1.1,
B=o.map(r=>{const x=r[5+i*5],ok=c.ok(x);return `<div class="hb"><span class="nm">${r[0]}</span><div class="tr"><i style="width:${x/M*100}%;background:${ok?'linear-gradient(90deg,#12b76a,#00c2a8)':'linear-gradient(90deg,#ff4d6d,#ff8a3d)'}"></i><u style="left:${T/M*100}%"></u></div><b>${x.toFixed(2)}</b></div>`}).join('');
return `<div class="box"><h2>${c.i[i]}</h2><p class="mut">เส้นประสีแดง = ${c.rule}</p><div class="g2"><div><h3>แนวโน้มรายไตรมาส: ${u}</h3>${A}</div><div><h3>เปรียบเทียบรวมปีงบประมาณ รายหน่วยบริการ (เขียว = ผ่าน, แดง = ไม่ผ่าน)</h3>${B}</div></div></div>`}).join('')}
function bind(s){$('#fi').onchange=e=>{st[s].i=+e.target.value;draw()};$('#fu').onchange=e=>{st[s].u=e.target.value;draw()};
const b=$('#ex');
b.onclick=async()=>{const c=CFG[s],q=r=>'"'+String(r).replace(/"/g,'""')+'"';
const l=[["หน่วยบริการ","ตัวชี้วัด","ไตรมาส 1","ไตรมาส 2","ไตรมาส 3","ไตรมาส 4","รวมปีงบ 2569","แปลผล"].map(q).join(",")];
rows(s).forEach(r=>l.push([r.u,c.i[r.ii],...r.v,r.ok?"ผ่าน":"ไม่ผ่าน"].map(q).join(",")));
const fn=`rlu-${s==2?'hospital':'cup'}.csv`,data="\ufeff"+l.join("\r\n");try{if(dl)await dl.save({filename:fn,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=fn;a.click()}}catch(e){}}}
function draw(){$('#nav').innerHTML=[["ภาพรวมจังหวัด"],["ตัวชี้วัดรายโรงพยาบาล"],["ตัวชี้วัดราย CUP"]].map((t,i)=>`<button class="${tab===i+1?'on':''}" data-t="${i+1}">${t}</button>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;draw()});
$('#m').innerHTML=tab===1?ov():dt(tab+0);if(tab>1)bind(tab)}
draw();
try{window.claude&&claude.use("downloads").then(d=>{dl=d;if(tab>1)draw()}).catch(()=>{})}catch(e){}
</script></body></html>
